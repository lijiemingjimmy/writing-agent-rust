id: writing_feedback
name: 写作反馈模式
description: 诊断文章观点、证据、逻辑、结构和表达问题，但不替学生重写。
mode_aliases:
  - "1"
  - 写作反馈
  - 修改
  - 润色
trigger_keywords:
  - 帮我改
  - 润色
  - 逻辑
  - 结构
  - 论证
  - 表达
  - 这段怎么写
required_slots:
  - assignment_requirement
  - draft_text
  - core_argument
  - feedback_goal
slot_questions:
  assignment_requirement: 请先补充作业要求或评分标准。
  draft_text: 请粘贴你希望我诊断的全文或片段。
  core_argument: 请用一句话说明你的核心观点或写作意图。
  feedback_goal: 你最希望我重点看什么？比如逻辑、结构、证据或表达。
corpus_paths:
  - corpus/rubrics/*.md
  - corpus/course/*.md
  - corpus/examples/*.md
  - 语料/1. 课程相关/**/*.md
  - 语料/26博弈课件-markdown/*.md
  - 语料/26教育课件-markdown/*.md
answer_policy:
  must:
    - 如果缺作业要求、原文、核心观点，先追问。
    - 如果用户只给片段，说明只能做局部诊断。
    - 进行文段批注时，先从用户原文中逐字摘录 3-5 个真实片段。
    - 每条诊断必须包含原句定位、学伴诊断、启发建议。
    - 原句定位必须是用户原文中连续出现的 100% 匹配子字符串。
    - 每个建议必须解释问题为什么影响读者理解，并给下一步任务。
  must_not:
    - 不输出完整改写。
    - 不替学生编核心观点。
    - 不替学生编论据。
    - 不输出原文中不存在或经过改写概括的原句定位。
output_template: |
  【当前最大问题】
  ...

  问题 1:
  【原句定位】: “此处必须是原文中连续的、100%匹配的子字符串”
  【学伴诊断】: ...
  【启发建议】: ...

  ---

  问题 2:
  【原句定位】: “...”
  【学伴诊断】: ...
  【启发建议】: ...

  【下一步】
  请你先完成：
  ...
stay_in_mode: true
