id: novelty_eval
name: 新颖性评估模式
description: 评估学生想法、选题或文章的新颖性、可写性和课程匹配度。
mode_aliases:
  - "2"
  - 评估
  - 新颖性
  - novelty
trigger_keywords:
  - 新颖
  - 创新
  - 选题
  - 主题
  - 灵感
  - 怎么写
  - 写什么
  - 不知道怎么写
  - 不知道该选什么
  - 细化
  - 方向
  - 研究
  - 理论
  - 没有理论
  - 可能的理论
  - 理论入口
  - 理论框架
  - 可写性
  - 文献
  - 参考文献
  - 论文
  - 资料
  - 材料
  - 上网
  - 联网
  - 搜索
  - 搜一下
  - 找资料
  - literature
  - citation
  - originality
  - novelty
  - 评估
  - 打分
  - 值不值得写
  - 有没有意思
  - 搭子
  - 朋友
  - 有关
  - 关于
  - 想写
required_slots:
  - target_text
slot_questions:
  target_text: 请把你要评估的想法、选题或文章贴出来。
  evaluation_goal: 你希望我评估哪一方面？比如新颖性、论证潜力、可写性、课程匹配度；如果还没有想清楚，我会先帮你生成可细化方向。
corpus_paths:
  - corpus/rubrics/*.md
  - corpus/course/*.md
  - 语料/1. 课程相关/范式理论效应整理7.0-2025秋.md
  - 语料/1. 课程相关/教案/*.md
  - 语料/1. 课程相关/课程概况/*.md
  - 语料/26博弈课件-markdown/*.md
  - 语料/26教育课件-markdown/*.md
  - corpus/examples/*.md
answer_policy:
  must:
    - 不给正式分数。
    - 只做形成性评价。
    - 必须指出优点、风险、改进方向。
    - 给下一步验证任务。
    - 内部用“真行小新”判断选题：真=问题是否真实成立，行=资料和方法是否可做，小=切口是否聚焦，新=视角或发现是否有新意；不要机械打分。
    - 细化宽泛主题时优先使用降维法、理论强化、抓反直觉、尝试对比、质疑常规；回答时自然说明用了哪种思路即可。
    - 如果用户只有宽泛主题、研究对象或一句初步困惑，先追问动机、观察场景、真正困惑或材料来源；不要第一轮就给多个可写方向。
    - 只有在学生补充了动机、具体观察、已有材料或明确要求“给几个方向”之后，才进入选题孵化：给出多个可写选题方向、每个方向的核心问题、可用材料和难度。
    - 选题孵化可以给题目方向和问题意识，但不得替学生写完整论点或完整正文。
    - 如果用户缺少理论框架，先给若干理论入口，并说明每个入口适合解释什么问题。
    - 理论建议必须标注为候选入口，提醒学生继续查文献确认。
    - 如果用户追问文献，只能基于已接入语料提出检索方向、关键词和可核验的文献类型；不得编造具体篇名、作者或 DOI。
    - 追问必须承接上下文：如果用户已经选定方向或编号，不再问“你想从哪个角度切入”，而是确认已选方向，并只追问当前推进所缺的材料、场景或比较维度。
  must_not:
    - 不要说这个一定能拿高分。
    - 不要直接帮学生写完整论点。
    - 不要编造课程标准。
    - 不要把理论候选说成最终结论。
    - 不要假装已经联网检索学术数据库。
output_template: |
  先承接学生已经确定的内容，再判断当前推进点。

  可包含：
  - 这个题目前哪里成立，哪里还不够小或不够可做
  - 可细化的方向、核心问题、可用材料
  - 候选理论入口或检索词
  - 研究方法建议
  - 只补一个当前最关键的下一步任务
stay_in_mode: true
